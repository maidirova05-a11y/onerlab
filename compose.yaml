# OnerLab целиком на своём сервере: сайт + собственная база Postgres.
# Запасной вариант на случай, если Vercel или Neon недоступны — см. BACKUP.md.
#
#   cp docker.env.example docker.env   # и заполнить
#   docker compose up -d --build
#
# Сайт слушает только 127.0.0.1:3101 — наружу его отдаёт Caddy/nginx с HTTPS.
# DATABASE_URL здесь намеренно не берётся из окружения: контейнер всегда
# работает со своей базой и не может случайно подключиться к боевой.

name: onerlab

x-db-url: &db-url postgresql://app:app@db:5432/app

services:
  db:
    image: postgres:${POSTGRES_MAJOR:-17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Применяет миграции Prisma и завершается; сайт стартует после него.
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://onerlab.kz}
    image: onerlab-app
    restart: unless-stopped
    env_file: docker.env
    environment:
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://onerlab.kz}
    ports:
      - "127.0.0.1:${APP_PORT:-3101}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
